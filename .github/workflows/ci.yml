name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package contents
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q 'dist/recorder/index.js' pack.txt
          grep -q 'python/transcribe_fw.py' pack.txt
          grep -q 'LICENSE' pack.txt
          ! grep -E 'test/|fixtures' pack.txt

  # Headless Chromium with a fake microphone needs no GPU and no network beyond npm.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
